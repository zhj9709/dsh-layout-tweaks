# dsh-style-tweaks bundle patch
#
# Declared by `dsh.bundle.patch` in package.json: when the plugin is installed
# through the official CLI —
#
#   dsh plugin --profile <name> add dsh-style-tweaks
#
# — the command appends `dsh-style-tweaks` to the profile's bundle
# stack and this patch mounts the server-side plugin row.
- insert:
    - id: style-tweaks
      name: 'dsh-style-tweaks'
